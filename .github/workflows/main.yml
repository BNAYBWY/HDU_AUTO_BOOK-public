name: HDU Auto Book

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '30 12 * * *'  # UTC 11:55 = 北京时间 19:55（抢座前5分钟启动）
  # 可选：每天12点检查一次健康状态
  # - cron: '0 4 * * *'   # UTC 4:00 健康检查

jobs:
  bot:
    runs-on: ubuntu-latest
    
    # 添加超时限制，防止任务无限运行
    timeout-minutes: 30
    
    # 环境变量
    env:
      TZ: Asia/Shanghai  # 设置时区
    
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4  # 升级到 v4
        with:
          fetch-depth: 1  # 只获取最新代码，加快速度
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # 使用更稳定的 3.11 版本
          cache: 'pip'  # 缓存 pip 依赖
          
      - name: Cache Chrome
        id: cache-chrome
        uses: actions/cache@v3
        with:
          path: /opt/google/chrome
          key: ${{ runner.os }}-chrome-${{ env.CHROME_VERSION }}
          restore-keys: |
            ${{ runner.os }}-chrome-
            
      - name: Install Chrome
        run: |
          # 安装特定版本的 Chrome 以确保稳定性
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          
          # 获取 Chrome 版本
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          echo "CHROME_VERSION=$CHROME_VERSION" >> $GITHUB_ENV
          echo "Installed Chrome version: $CHROME_VERSION"
          
      - name: Install ChromeDriver
        run: |
          # 使用更可靠的方式获取匹配的 ChromeDriver
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d '.' -f 1-3)
          echo "Looking for ChromeDriver for Chrome version: $CHROME_VERSION"
          
          # 尝试多个来源获取 ChromeDriver
          DRIVER_URL=""
          
          # 方法1: 使用 Chrome for Testing API（推荐）
          if [ -z "$DRIVER_URL" ]; then
            DRIVER_URL=$(curl -s 'https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json' | \
              jq -r --arg version "$CHROME_VERSION" '.versions[] | select(.version | startswith($version)) | .downloads.chromedriver[] | select(.platform == "linux64") | .url' | \
              head -1)
          fi
          
          # 方法2: 使用最新稳定版
          if [ -z "$DRIVER_URL" ]; then
            DRIVER_URL=$(curl -s 'https://googlechromelabs.github.io/chrome-for-testing/latest-versions.json' | \
              jq -r '.channels.Stable.downloads.chromedriver[] | select(.platform == "linux64") | .url')
          fi
          
          # 方法3: 使用备用源
          if [ -z "$DRIVER_URL" ]; then
            echo "Failed to get ChromeDriver URL, using fallback"
            DRIVER_URL="https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/latest/linux64/chromedriver-linux64.zip"
          fi
          
          echo "Downloading ChromeDriver from: $DRIVER_URL"
          curl --silent --show-error --location --fail --retry 5 --retry-delay 2 \
            --output /tmp/chromedriver_linux64.zip "$DRIVER_URL"
          
          cd /tmp
          unzip -q chromedriver_linux64.zip
          rm -rf chromedriver_linux64.zip
          
          # 查找并安装 chromedriver
          if [ -d "chromedriver-linux64" ]; then
            sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
          elif [ -f "chromedriver" ]; then
            sudo mv chromedriver /usr/local/bin/chromedriver
          fi
          
          sudo chmod +x /usr/local/bin/chromedriver
          chromedriver --version
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 创建 requirements.txt（如果不存在）
          if [ ! -f requirements.txt ]; then
            cat > requirements.txt << EOF
            requests>=2.31.0
            PyYAML>=6.0
            selenium>=4.15.0
            EOF
          fi
          
          pip install -r requirements.txt
          
          # 额外安装可能需要的依赖
          pip install --upgrade urllib3 chardet certifi
          
      - name: Create config files
        run: |
          # 创建配置目录（如果不存在）
          mkdir -p config
          
          # 创建 basic_config.yml（如果不存在）
          if [ ! -f config/basic_config.yml ]; then
            cat > config/basic_config.yml << 'EOF'
            SeatAutoBooker:
              target: "https://hdu.huitu.zhishulib.com/Seat/Reserver/add"
              headers:
                User-Agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                Content-Type: "application/x-www-form-urlencoded; charset=UTF-8"
                Accept: "application/json, text/javascript, */*; q=0.01"
                Accept-Language: "zh-CN,zh;q=0.9,en;q=0.8"
                Referer: "https://hdu.huitu.zhishulib.com/"
                Origin: "https://hdu.huitu.zhishulib.com"
                X-Requested-With: "XMLHttpRequest"
            EOF
          fi
          
          # 创建 user_config.yml（如果不存在，使用示例）
          if [ ! -f user_config.yml ]; then
            cat > user_config.yml << 'EOF'
            enabled: true
            自定义:
              - 1  # 请替换为实际的座位ID
            EOF
            echo "警告: 请修改 user_config.yml 中的座位ID"
          fi
          
          # 显示配置文件内容（隐藏敏感信息）
          echo "配置文件检查完成"
          
      - name: Run Auto Book
        env:
          SCHOOL_ID: ${{ secrets.SCHOOL_ID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          SCKEY: ${{ secrets.SCKEY }}
          # 添加额外的环境变量
          PYTHONUNBUFFERED: 1  # 实时输出日志
          TZ: Asia/Shanghai
        run: |
          echo "开始执行抢座脚本..."
          echo "当前时间: $(date)"
          python main.py
          
      - name: Upload logs on failure
        if: failure()  # 只在失败时上传
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-${{ github.run_id }}
          retention-days: 7  # 保留7天
          path: |
            *.html
            *.png
            *.log
            debug_*
            screenshot_*
            
      - name: Upload success logs
        if: success()  # 成功时也上传（可选）
        uses: actions/upload-artifact@v4
        with:
          name: success-logs-${{ github.run_id }}
          retention-days: 3
          path: |
            *.log
            *.txt
            
      - name: Clean up
        if: always()  # 总是执行清理
        run: |
          # 清理临时文件
          rm -rf /tmp/chromedriver* 2>/dev/null || true
          rm -rf debug_* 2>/dev/null || true
          rm -rf screenshot_* 2>/dev/null || true
          echo "清理完成"
          
      - name: Send notification on failure
        if: failure() && github.event_name != 'workflow_dispatch'  # 只在自动运行时发送失败通知
        env:
          SCKEY: ${{ secrets.SCKEY }}
        run: |
          if [ -n "$SCKEY" ]; then
            curl -s -X POST "https://sctapi.ftqq.com/${SCKEY}.send" \
              -H "Content-Type: application/json" \
              -d "{
                \"title\": \"❌ HDU抢座失败 - ${{ github.run_id }}\",
                \"desp\": \"抢座脚本执行失败，请检查日志\n\n时间: $(date)\n仓库: ${{ github.repository }}\n运行ID: ${{ github.run_id }}\"
              }" || true
          fi
